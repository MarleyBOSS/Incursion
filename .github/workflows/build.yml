name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: incursion-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Every push to main replaces the "dev" pre-release with the freshly built jar,
      # so the newest build is always downloadable from the Releases page.
      - name: Publish development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev build/libs/*.jar \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Development build" \
            --notes "Automatic build of commit ${{ github.sha }}. Download the .jar below and put it into your mods folder."
