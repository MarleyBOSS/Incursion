name: Probe

# Starts a headless server, builds water channels and logs how zombies swim in them (see PhysicsProbe).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run probe server
        env:
          INCURSION_PROBE: "1"
        run: |
          mkdir -p run run/server
          echo "eula=true" > run/eula.txt
          echo "eula=true" > run/server/eula.txt
          timeout 900 ./gradlew runServer --stacktrace 2>&1 | tee probe.log || true
          grep "PROBE" probe.log || true
      - name: Publish results to branch probe-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          grep "PROBE" probe.log > out/probe-results.txt || echo "no PROBE lines" > out/probe-results.txt
          tail -n 80 probe.log > out/probe-tail.txt
          cd out
          git init -q -b probe-results
          git config user.name probe
          git config user.email probe@example.invalid
          git add -A
          git commit -qm "probe results"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" probe-results
      - uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: probe.log
